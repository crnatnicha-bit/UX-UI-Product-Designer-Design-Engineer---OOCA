<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ร้านลับริมทาง · ooca prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --tq:#00C4B3; --tq2:#B3EDE8; --tq3:#DBF0EE; --tq-text:#009688;
    --blue:#1F77DF; --blue4:#C7DDF7;
    --marigo:#F9A000; --marigo2:#F8E4B3;
    --error:#EF7773;
    --g1:#355956; --g2:#3F6866; --g3:#528984; --g4:#79ADA9;
    --blue-d:#1868C6; --tq-d:#009688; --danger:#C64A46;
    --line:#F1F1F1; --bg:#F6F6F6; --white:#FFFFFF;
    --shadow:0 8px 16px 0 rgba(0,196,179,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:'Prompt',sans-serif;font-weight:300;color:var(--g1);background:linear-gradient(160deg,#DBF0EE,#E4EFFB);display:flex;justify-content:center;align-items:center}
  button{font-family:inherit}
  .app{position:relative;width:100%;max-width:420px;height:100%;max-height:880px;background:var(--white);overflow:hidden;display:flex;flex-direction:column}
  @media (min-width:480px){.app{border-radius:32px;height:calc(100% - 32px);box-shadow:0 16px 32px rgba(0,196,179,.18),0 4px 12px -4px rgba(0,196,179,.4)}}

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;animation:in .45s ease both}
  .screen.out{animation:out .25s ease both}
  @keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  @keyframes out{to{opacity:0;transform:translateX(-16px)}}
  .screen.back-in{animation-name:inback}
  @keyframes inback{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}

  .top{display:flex;align-items:center;gap:12px;padding:16px 20px 8px;font-size:12px;color:var(--g2);flex:none}
  .iconbtn{width:36px;height:36px;border-radius:50%;background:var(--bg);border:0;display:grid;place-items:center;color:var(--g1);font-size:18px;cursor:pointer}
  .iconbtn:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--blue4);outline-offset:2px}
  .progress{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
  .progress i{display:block;height:100%;background:var(--tq);border-radius:6px;transition:width .5s ease}

  .scene{flex:none;height:min(34vh,270px);margin:4px 16px 0;border-radius:24px;position:relative;overflow:hidden}
  .scene svg.bg{position:absolute;inset:0;width:100%;height:100%}
  .scene .mooca{position:absolute;width:30%;max-width:124px;bottom:6px;right:10px;animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px)}}
  .rain{position:absolute;inset:0;pointer-events:none}
  .rain i{position:absolute;top:-20px;width:2px;height:16px;border-radius:2px;background:rgba(255,255,255,.75);animation:fall linear infinite}
  @keyframes fall{to{transform:translate(-14px,320px)}}
  .spark{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .spark:nth-of-type(2n){animation-delay:.8s}.spark:nth-of-type(3n){animation-delay:1.5s}
  @keyframes tw{50%{opacity:.25;transform:scale(.7)}}

  .body{padding:18px 20px 24px;flex:1;display:flex;flex-direction:column}
  .story{font-size:15px;line-height:24px;margin:0 0 6px}
  .story b{font-weight:500}
  .ask{font-size:18px;line-height:26px;font-weight:500;color:var(--blue-d);margin:4px 0 14px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{border:1.5px solid var(--blue-d);color:var(--blue-d);background:var(--white);border-radius:24px;padding:11px 16px;font-size:15px;font-weight:500;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(31,119,223,.08);transition:background .2s,color .2s,transform .15s}
  .opt:hover{background:#F4F8FE}
  .opt:active{transform:scale(.98)}
  .opt.sel{background:var(--blue-d);color:#fff}
  .opt.ghost{border-style:dashed;border-color:var(--g2);color:var(--g3);box-shadow:none}
  .opt.ghost.sel{background:var(--g3);border-color:var(--g3);color:#fff}
  .opts.locked .opt:not(.sel){opacity:.45;pointer-events:none}
  .opt.scale{display:flex;align-items:center;gap:10px;text-align:left}
  .opt.scale .dot{width:22px;height:22px;border-radius:50%;flex:none}
  .opt.danger{border-color:var(--danger);color:var(--danger)}
  .opt.danger.sel{background:var(--danger);color:#fff}

  .btn{display:block;width:100%;text-align:center;border:0;border-radius:24px;padding:13px 16px;font-size:16px;font-weight:500;cursor:pointer;text-decoration:none}
  .btn.primary{background:var(--tq-d);color:#fff;font-size:19px;font-weight:600}
  .btn.primary:hover{background:#00897B}
  .btn.outline{background:#fff;border:1.5px solid var(--tq);color:var(--tq-text)}
  .btn.red{background:var(--danger);color:#fff}
  .btn.plain{background:none;color:var(--g2);font-size:14px;font-weight:400}
  .fine{font-size:12px;line-height:18px;color:var(--g2);text-align:center;margin:10px 0 0}
  .link{display:block;text-align:center;font-size:13px;color:var(--blue-d);text-decoration:underline;margin-top:10px;background:none;border:0;cursor:pointer;width:100%}

  /* intro */
  .intro{background:linear-gradient(180deg,#D7FFFC 0%,#E0FEFB 45%,#fff 100%)}
  .intro .hero{display:flex;justify-content:center;padding:min(9vh,64px) 0 8px}
  .intro .hero img{width:min(56vw,230px);animation:bob 3.2s ease-in-out infinite}
  .intro h1{font-size:26px;line-height:36px;font-weight:600;color:#000;text-align:center;margin:8px 24px}
  .intro p{font-size:15px;line-height:24px;text-align:center;color:var(--g3);margin:0 28px}
  .chips{display:flex;gap:8px;justify-content:center;margin:18px 12px 0;flex-wrap:wrap}
  .chip{font-size:12px;padding:5px 10px;border-radius:24px;background:#fff;color:var(--g2);border:1px solid var(--tq2)}
  .bottom{margin-top:auto;padding:20px}

  /* loading */
  .loading{align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 40%,#3F6866,#1A3331);color:#fff}
  .loading img{width:150px;animation:bob 1.4s ease-in-out infinite}
  .loading p{font-size:16px;margin:16px 24px 0}
  .dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#FFE27A;margin:14px 3px 0;animation:tw 1s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}

  /* result */
  .result{background:linear-gradient(180deg,#DBF0EE 0%,#fff 35%)}
  .result .wrap{padding:4px 20px 24px}
  .kicker{font-size:12px;color:var(--g2);margin:4px 0 4px}
  .skyline{font-size:20px;line-height:28px;font-weight:600;color:#000;margin:0 0 12px}
  .items{display:flex;gap:10px;margin-bottom:12px}
  .item{flex:1;border-radius:16px;padding:12px 10px;text-align:center;color:#fff;background:radial-gradient(circle at 50% 30%,#4F7F7B,#1F3B39);box-shadow:var(--shadow);animation:pop .5s ease both}
  .item.gift{background:radial-gradient(circle at 50% 30%,#00C4B3,#009688);animation-delay:.15s}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.95)}}
  .item svg{width:64px;height:64px;display:block;margin:0 auto 4px}
  .item small{display:block;font-size:11px;opacity:.85}
  .item b{display:block;font-size:15px;font-weight:500}
  .reflect{background:#fff;border-radius:16px;padding:14px;font-size:14px;line-height:22px;box-shadow:var(--shadow);margin-bottom:12px}
  .reflect b{font-weight:600;color:var(--g1)}
  .tiny{background:var(--marigo2);border-radius:16px;padding:12px;margin-bottom:12px;font-size:13px;line-height:20px;color:#5c3d00}
  .tiny .row{display:flex;align-items:center;gap:10px}
  .tiny .ic{width:36px;height:36px;border-radius:50%;background:var(--marigo);color:#fff;display:grid;place-items:center;flex:none;font-size:15px}
  .tiny b{font-weight:500}
  .tiny .btn{margin-top:10px;background:#fff;color:#7a5200;font-size:14px;padding:9px}
  .tiny textarea{width:100%;margin-top:10px;border:1px solid #E8C98A;border-radius:12px;padding:10px;font-family:inherit;font-size:14px;resize:none;background:#fff;color:var(--g1)}
  .next{border:1.5px solid var(--tq2);border-radius:16px;padding:14px;background:#fff}
  .next p{margin:0 0 10px;font-size:14px;line-height:22px}
  .next .hot{font-size:12px;color:var(--g3);margin:10px 0 0;text-align:center}
  .next .hot a{color:#C64A46;font-weight:500}
  .again{margin-top:14px}


  /* opening scene */
  .scene.tall{height:min(46vh,380px)}
  .story.big{font-size:18px;line-height:30px;color:var(--g1);text-align:center;margin:12px 0 20px}
  .mooca.walk{animation:walk 3.5s ease-in-out forwards}
  @keyframes walk{from{transform:translateX(40px)}to{transform:translateX(-30px)}}
  /* mirror reflection */
  .reflection{position:absolute;width:36%;left:50%;top:41%;transform:translateX(-50%) scaleX(-1);transition:opacity .3s,filter .3s}
  /* result: summary + why + swap */
  .summary{font-size:16px;line-height:26px;color:var(--g1);margin:0 0 8px;font-weight:400}
  .meta{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .why{font-size:13px;color:var(--g2);flex:1;min-width:180px}
  .why[open]{flex-basis:100%;order:2}
  .why summary{cursor:pointer;color:var(--blue-d);text-decoration:underline}
  .why p{background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0 0;line-height:21px;box-shadow:var(--shadow);color:var(--g1)}
  .why b{font-weight:600}
  .swapbtn{background:none;border:1px solid var(--g3);color:var(--g2);border-radius:24px;padding:4px 12px;font-family:inherit;font-size:12px;cursor:pointer}
  .swap{background:#fff;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
  .swap p{font-size:13px;margin:0 0 8px;color:var(--g2)}
  .chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px}
  .pick{flex:none;width:72px;border:1.5px solid var(--line);background:#1F3B39;border-radius:12px;padding:6px 4px;cursor:pointer;font-family:inherit;color:#fff}
  .pick svg{width:36px;height:36px;display:block;margin:0 auto}
  .pick span{display:block;font-size:10px;line-height:13px;margin-top:2px}
  .pick.on{border-color:var(--marigo);box-shadow:0 0 0 2px var(--marigo2)}
  /* breathing */
  .overlay{position:absolute;inset:0;background:rgba(26,51,49,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:20;animation:in .3s ease both;text-align:center;padding:24px}
  .breath{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#B3EDE8,#00C4B3);display:grid;place-items:center;transition:transform 4s ease-in-out;transform:scale(.6);box-shadow:0 0 60px rgba(0,196,179,.5)}
  .breath img{width:110px}
  .overlay p{font-size:20px;font-weight:500;margin:28px 0 4px}
  .overlay small{opacity:.75}
  .overlay .btn{max-width:220px;margin-top:28px}

  /* safety */
  .safety{background:#FFF8F8}
  .safety .hero{display:flex;justify-content:center;padding:min(7vh,48px) 0 0}
  .safety .hero img{width:190px}
  .safety h2{font-size:22px;line-height:32px;font-weight:600;color:#000;text-align:center;margin:12px 24px 6px}
  .safety p{font-size:14px;line-height:22px;text-align:center;margin:0 28px 18px}
  .stack{display:flex;flex-direction:column;gap:10px;padding:0 20px}
  .btn small{display:block;font-size:12px;font-weight:300;opacity:.9}

  .toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g1);color:#fff;font-size:13px;padding:10px 16px;border-radius:24px;z-index:30;width:max-content;max-width:88%;text-align:center;animation:in .25s ease both}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- state ---------- */
const app=document.getElementById('app');
let S={a:{},check:null,hist:[]};
let current=null;

function go(name,{back=false}={}){
  if(!back&&current) S.hist.push(current);
  current=name;
  const old=app.querySelector('.screen');
  const render=()=>{app.innerHTML='';const el=VIEWS[name]();el.classList.add('screen');if(back)el.classList.add('back-in');app.appendChild(el);el.scrollTop=0;const f=el.querySelector('h1,h2,.ask');f&&f.setAttribute('tabindex','-1');};
  if(old){old.classList.add('out');setTimeout(render,200)}else render();
}
function goBack(){const p=S.hist.pop();if(p)go(p,{back:true})}
function h(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild}
function toast(msg){const t=h(`<div class="toast">${msg}</div>`);app.appendChild(t);setTimeout(()=>t.remove(),2200)}
function rain(n=26){let s='';for(let i=0;i<n;i++)s+=`<i style="left:${Math.random()*110}%;animation-duration:${.7+Math.random()*.6}s;animation-delay:${-Math.random()*2}s"></i>`;return `<div class="rain">${s}</div>`}

function topBar(n){return `<div class="top"><button class="iconbtn" data-back aria-label="ย้อนกลับ">‹</button><span class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${TOTAL}" aria-valuenow="${n}"><i style="width:${(n-1)/TOTAL*100}%"></i></span><span>${n}/${TOTAL}</span></div>`}

function sceneView(key){
  const c=SCENES[key];
  let art=SVG[c.svg];
  if(key==='shop'&&CARRY[S.a.shelf]){
    const inner=ICON[CARRY[S.a.shelf].icon].replace('<svg viewBox="0 0 60 60">','').replace('</svg>','');
    art=art.replace('<g id="held"></g>',`<g transform="translate(40 108)">${inner}</g>`);
  }
  if(key==='shop'){
    const light=S.a.shelf==='feather';
    art=art.replace('{{L1}}',light?'"ชิ้นนี้เบาดีนะ วันนี้เป็นยังไงบ้าง?':'"ชิ้นนี้หนักนะ แบกมาไกลไหม?').replace('{{L2}}',light?'เล่าให้ฟังหน่อยได้ไหม"':'อยากเล่าให้ฟังหน่อยไหม"');
  }
  const el=h(`<section>
    ${topBar(c.n)}
    <div class="scene">${art}
      ${c.reflect?`<img class="reflection" src="${IMG.sad}" alt="" style="opacity:.75">${SVG.mirrorGlare}`:''}
      ${c.rain?rain():''}
      <img class="mooca" src="${IMG[c.mooca]}" alt="" style="${c.moocaLeft?'left:8px;right:auto;':''}${c.reflect?'width:28%;':''}">
    </div>
    <div class="body">
      <p class="story">${key==='gift'&&S.a.door==='pass'?'คุณเปิดกล่องเล็กๆ ข้างในมีของวางอยู่ 4 ชิ้น พร้อมโน้ตว่า "เลือกติดตัวไปหนึ่งชิ้นนะ"':c.story}</p>
      <p class="ask">${c.ask}</p>
      <div class="opts" role="list">${c.opts.map(([v,t,cls])=>`<button class="opt ${cls||''} ${S.a[key]===v?'sel':''}" data-v="${v}" role="listitem">${t}</button>`).join('')}</div>
    </div></section>`);
  requestAnimationFrame(()=>{const bar=el.querySelector('.progress i');bar&&(bar.style.width=(c.n/TOTAL*100)+'%')});
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    S.a[key]=b.dataset.v;
    el.querySelector('.opts').classList.add('locked');
    el.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o===b));
    let wait=420;
    if(key==='mirror'){
      // ภาพในกระจกเปลี่ยนตามคำตอบ ก่อนไปฉากถัดไป
      const r=REFLECT[b.dataset.v], img=el.querySelector('.reflection');
      img.style.opacity=0;
      setTimeout(()=>{img.src=IMG[r.img];img.style.cssText=r.css},300);
      wait=1500;
    }
    setTimeout(()=>go(c.next(b.dataset.v)),wait);
  });
  return el;
}

        <p class="story">คุณเดินผ่านไปได้ไม่กี่ก้าว ก็ได้ยินเสียงกระดิ่งเบาๆ</p>
        <p class="story">เจ้าของร้านวางกล่องเล็กๆ ไว้หน้าประตู พร้อมโน้ตเขียนว่า</p>
        <p class="ask" style="color:var(--g1)">"ร้านนี้จะอยู่ตรงนี้ จนกว่าคุณจะพร้อม"</p>
        <div class="bottom" style="padding:8px 0 0"><button class="btn primary" data-next>เปิดกล่อง</button></div>
      </div></section>`);
    el.querySelector('[data-next]').onclick=()=>go('gift');
    return el;
  },
  check(){
    const lv=[['เบาสบาย ฟ้าใส','#FFE27A'],['มีเมฆบ้าง แต่ยังไหว','#C7DDF7'],['ครึ้มหนัก ฝนตกมาหลายวัน','#8FBBEF'],['หนักมาก จนบางครั้งคิดว่าไม่อยากมีชีวิตอยู่','#EF7773']];
    const el=h(`<section>
      <div class="top"><button class="iconbtn" data-back aria-label="ย้อนกลับ">‹</button><span style="flex:1"></span><span>เกือบเสร็จแล้ว</span></div>
      <div class="body" style="padding-top:28px">
        <p class="story" style="color:var(--g2)">ก่อนดูของที่คุณได้จากร้าน ขอถามตรงๆ หนึ่งข้อนะ</p>
        <p class="ask" style="font-size:22px;line-height:32px;color:#000">ช่วงนี้ใจคุณหนักแค่ไหน?</p>
        <div class="opts">${lv.map(([t,c],i)=>`<button class="opt scale ${i===3?'danger':''} ${S.check===i?'sel':''}" data-v="${i}"><i class="dot" style="background:${c}"></i>${t}</button>`).join('')}</div>
        <p class="fine" style="margin-top:auto;padding-top:20px">คำตอบนี้ใช้แค่แสดงผลบนเครื่องคุณ ไม่มีการบันทึก</p>
      </div></section>`);
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      S.check=+b.dataset.v;
      el.querySelector('.opts').classList.add('locked');
      el.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o===b));
      setTimeout(()=>go(S.check===3?'safety':'loading'),420);
    });
    return el;
  },
  loading(){
    const el=h(`<section class="loading"><img src="${IMG.hug}" alt=""><p>เจ้าของร้านกำลังห่อของให้คุณ</p><div class="dots"><i></i><i></i><i></i></div></section>`);
    setTimeout(()=>{if(current==='loading'){current=null;go('result')}},1400);
    return el;
  },
  result(){
    const a=S.a, pass=a.door==='pass';
    const carryKey=pass?'pass':a.shelf;
    const carry=CARRY[carryKey], gift=GIFT[a.gift];
    // สรุป 1 ประโยค (แสดงเสมอ) + รายละเอียดเต็ม (ซ่อนไว้ใน "ทำไมถึงได้ของชิ้นนี้?")
    const summary=`${carry.mean} และ${gift.mean}`;
    let why = pass
      ? `วันนี้คุณเลือกเดินผ่านไปก่อน แต่ก็ยังเปิดกล่องที่ร้านทิ้งไว้ให้`
      : `วันนี้${DOOR[a.door]} หยิบ<b>${carry.name}</b>จากชั้นวาง ${MIRROR[a.mirror]} ${SHOP[a.shop]}`;
    why += ` ก่อนกลับคุณเลือก<b>${gift.name}</b>ติดตัวไป`;
    const carryChoices=(pass?['pass']:[]).concat(['jar','compass','hourglass','lantern','feather']);
    const tiny={
      umbrella:`<div class="row"><span class="ic">✉</span><div><b>สิ่งเล็กๆ ตอนนี้:</b> ส่งข้อความสั้นๆ หาใครสักคนที่ไว้ใจ แค่ "ช่วงนี้เหนื่อยนิดหน่อย" ก็พอ</div></div>`,
      tea:`<div class="row"><span class="ic">☕</span><div><b>สิ่งเล็กๆ ตอนนี้:</b> หายใจช้าๆ ไปพร้อมกับ Mooca 4 รอบ ใช้เวลาแค่ 30 วินาที</div></div><button class="btn" data-breathe>เริ่มหายใจ</button>`,
      letter:`<div class="row"><span class="ic">✎</span><div><b>สิ่งเล็กๆ ตอนนี้:</b> เขียน 1 ประโยคว่าอะไรหนักที่สุดในตอนนี้ ไม่ต้องสวย แค่ให้มันออกมาจากหัว</div></div><textarea rows="2" placeholder="พิมพ์ตรงนี้ได้เลย ข้อความจะไม่ถูกบันทึก" aria-label="เขียนหนึ่งประโยค"></textarea>`,
      none:`<div class="row"><span class="ic">✦</span><div><b>สิ่งเล็กๆ ตอนนี้:</b> พรุ่งนี้ลองแวะร้านนี้อีกครั้ง ดูว่าของบนชั้นยังเป็นชิ้นเดิมไหม</div></div>`
    }[a.gift];
    const c=S.check;
    const wantsTalk=['stuck','open'].includes(a.shop)||a.gift==='umbrella';
    let next;
    if(c>=2||(c===1&&wantsTalk)){
      next=`<p>ถ้าอยากมีคนช่วยเรียบเรียงเรื่องที่แบกอยู่ นักจิตวิทยาของ ooca พร้อมฟังโดยไม่ตัดสิน</p>
        <button class="btn primary" data-cta="talk">คุยกับผู้เชี่ยวชาญ</button>
        <button class="link" data-cta="test">อยากรู้ให้ชัดขึ้น? ทำแบบทดสอบความเครียด (4–5 นาที)</button>
        ${c>=2?'<p class="hot">ถ้ารู้สึกหนักจนรับมือไม่ไหว โทร <a href="tel:1323">1323</a> ได้ตลอด 24 ชม.</p>':''}`;
    }else if(c===1){
      next=`<p>อยากรู้จักใจตัวเองให้ชัดขึ้นอีกนิดไหม แบบทดสอบความเครียดของ ooca ใช้เวลาแค่ 4–5 นาที</p>
        <button class="btn primary" data-cta="test">ทำแบบทดสอบความเครียด</button>
        <button class="link" data-cta="talk">หรือคุยกับผู้เชี่ยวชาญ</button>`;
    }else{
      next=`<p>วันนี้ใจคุณค่อนข้างเบา ดีจังเลย ร้านนี้จะอยู่ตรงนี้เสมอ ถ้าวันไหนฝนตกอีก</p>
        <button class="btn outline" data-cta="remind">ชวนกลับมาแวะสัปดาห์หน้า</button>
        <button class="link" data-cta="test">ทำแบบทดสอบความเครียด (4–5 นาที)</button>`;
    }
    const el=h(`<section class="result">
      <div class="top"><button class="iconbtn" data-home aria-label="ปิด">✕</button><span style="flex:1"></span><button class="link" style="width:auto;margin:0" data-cta="save">เก็บการ์ด ↓</button></div>
      <div class="wrap">
        <p class="kicker">ท้องฟ้าในใจวันนี้</p>
        <h2 class="skyline">${SKY[c]}</h2>
        <div class="items">
          <div class="item">${ICON[carry.icon]}<small>สิ่งที่คุณแบกมา</small><b>${carry.name}</b></div>
          <div class="item gift">${ICON[gift.icon]}<small>สิ่งที่ใจต้องการ</small><b>${gift.name}</b></div>
        </div>
        <p class="summary">${summary}</p>
        <div class="meta">
          <details class="why"><summary>ทำไมถึงได้ของชิ้นนี้?</summary><p>${why}</p></details>
          <button class="swapbtn" data-swap aria-expanded="false">ไม่ค่อยตรงกับฉัน</button>
        </div>
        <div class="swap" hidden>
          <p>เลือกของที่ใกล้ใจคุณกว่าได้เลย</p>
          <div class="chiprow">${carryChoices.map(k=>`<button class="pick ${k===carryKey?'on':''}" data-carry="${k}">${ICON[CARRY[k].icon]}<span>${CARRY[k].name}</span></button>`).join('')}</div>
          <div class="chiprow">${Object.keys(GIFT).map(k=>`<button class="pick ${k===a.gift?'on':''}" data-gift="${k}">${ICON[GIFT[k].icon]}<span>${GIFT[k].name}</span></button>`).join('')}</div>
        </div>
        <div class="tiny">${tiny}</div>
        <div class="next">${next}</div>
        <p class="fine">นี่เป็นภาพสะท้อนจากเรื่องเล่า ไม่ใช่การวินิจฉัย</p>
        <button class="btn plain again" data-again>แวะร้านอีกครั้ง ↺</button>
      </div></section>`);
    const msgs={talk:'(ต้นแบบ) จะพาไปหน้าเลือกนักจิตวิทยาของ ooca',test:'(ต้นแบบ) จะพาไปแบบทดสอบความเครียดของ ooca',remind:'(ต้นแบบ) ตั้งเตือนให้กลับมาแวะสัปดาห์หน้า',save:'(ต้นแบบ) บันทึกการ์ดเป็นรูปภาพ'};
    el.querySelectorAll('[data-cta]').forEach(b=>b.onclick=()=>toast(msgs[b.dataset.cta]));
    el.querySelector('[data-again]').onclick=()=>{S={a:{},check:null,hist:[]};current=null;go('intro')};
    el.querySelector('[data-home]').onclick=()=>{S={a:{},check:null,hist:[]};current=null;go('intro')};
    const br=el.querySelector('[data-breathe]'); if(br) br.onclick=breathe;
    const sw=el.querySelector('[data-swap]'),panel=el.querySelector('.swap');
    sw.onclick=()=>{panel.hidden=!panel.hidden;sw.setAttribute('aria-expanded',!panel.hidden)};
    const rerender=()=>{const y=el.scrollTop;const n=VIEWS.result();n.classList.add('screen');n.style.animation='none';app.replaceChild(n,el);n.querySelector('.swap').hidden=false;n.querySelector('[data-swap]').setAttribute('aria-expanded','true');n.scrollTop=y};
    el.querySelectorAll('[data-carry]').forEach(b=>b.onclick=()=>{const k=b.dataset.carry;if(k==='pass'){S.a.door='pass'}else{if(S.a.door==='pass')S.a.door='peek';S.a.shelf=k}rerender()});
    el.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{S.a.gift=b.dataset.gift;rerender()});
    return el;
  },
  safety(){
    const el=h(`<section class="safety">
      <div class="top"><button class="iconbtn" data-back aria-label="ย้อนกลับ">‹</button></div>
      <div class="hero"><img src="${IMG.sad}" alt="พระอาทิตย์ปลอบ Mooca"></div>
      <h2>ขอบคุณที่บอกเรานะ</h2>
      <p>ความรู้สึกนี้หนักจริงๆ และคุณไม่จำเป็นต้องแบกไว้คนเดียว ตอนนี้มีคนพร้อมคุยกับคุณ</p>
      <div class="stack">
        <a class="btn red" href="tel:1323">โทร 1323<small>สายด่วนสุขภาพจิต · ฟรี 24 ชม.</small></a>
        <button class="btn outline" data-talk>คุยกับนักจิตวิทยา ooca</button>
        <a class="btn plain" href="tel:1669">ถ้าอยู่ในอันตรายตอนนี้ โทร 1669</a>
      </div>
      <div class="bottom"><button class="link" data-res>ดูของที่ได้จากร้านต่อ ›</button></div>
    </section>`);
    el.querySelector('[data-talk]').onclick=()=>toast('(ต้นแบบ) จะพาไปหน้าเลือกนักจิตวิทยาของ ooca');
    el.querySelector('[data-res]').onclick=()=>go('result');
    return el;
  }
};

function breathe(){
  const o=h(`<div class="overlay" role="dialog" aria-label="หายใจไปพร้อมกัน"><div class="breath"><img src="${IMG.hug}" alt=""></div><p>หายใจเข้า…</p><small>รอบที่ 1 / 4</small><button class="btn outline" style="background:transparent;color:#fff;border-color:#fff">พอแค่นี้</button></div>`);
  app.appendChild(o);
  const ball=o.querySelector('.breath'),label=o.querySelector('p'),cnt=o.querySelector('small');
  let round=1,inhale=true,stop=false;
  const step=()=>{if(stop)return;ball.style.transform=inhale?'scale(1)':'scale(.6)';label.textContent=inhale?'หายใจเข้า…':'หายใจออก…';cnt.textContent=`รอบที่ ${round} / 4`;
    setTimeout(()=>{if(!inhale){round++; if(round>4){label.textContent='เก่งมาก ✦';cnt.textContent='ใจเบาลงอีกนิดแล้ว';o.querySelector('.btn').textContent='กลับไปที่การ์ด';return}}inhale=!inhale;step()},4000)};
  requestAnimationFrame(()=>requestAnimationFrame(step));
  o.querySelector('.btn').onclick=()=>{stop=true;o.remove()};
}

app.addEventListener('click',e=>{if(e.target.closest('[data-back]'))goBack()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=app.querySelector('.overlay');o&&o.remove()}});
go('intro');
</script>
</body>
</html>
