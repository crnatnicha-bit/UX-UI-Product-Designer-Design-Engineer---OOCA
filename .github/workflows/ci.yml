name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + responsive/a11y audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # อิมเมจของ Playwright มี Chromium + system deps ติดมาแล้ว ไม่ต้องติดตั้งใหม่ทุกรอบ (เดิมใช้ ~10 นาที)
    container: mcr.microsoft.com/playwright:v1.47.2-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright package
        run: npm install --no-save playwright@1.47.2
      - name: Serve site
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 1; done
      - name: Run tests and audit
        run: node scripts/ci-check.mjs
        env:
          BASE_URL: http://localhost:8080

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir _site
          cp -r index.html assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
